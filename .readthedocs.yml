# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
   os: ubuntu-24.04
   tools:
      python: "3.12"
   jobs:
      pre_create_environment:
         - tools/rtd-setup.sh
         # Dependencies are resolved from uv.lock rather than a hand-maintained
         # requirements.txt, so the docs build uses the same versions as development.
         - asdf plugin add uv
         - asdf install uv latest
         - asdf global uv latest
      create_environment:
         - uv venv "$READTHEDOCS_VIRTUALENV_PATH"
      install:
         - UV_PROJECT_ENVIRONMENT="$READTHEDOCS_VIRTUALENV_PATH" uv sync --group doc --no-group dev

sphinx:
   configuration: docs/source/conf.py
