[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PostBOUND"
version = "0.22.0.dev1"
authors = [{ name = "Rico Bergmann", email = "rico.bergmann1@tu-dresden.de" }]
description = "PostBOUND is a research framework to prototype and benchmark database query optimizers"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
dependencies = [
    "lazy-loader~=0.4",
    "levenshtein~=0.27",
    "natsort~=8.4",
    "networkx~=3.5",
    "numpy~=2.3",
    "pandas~=2.3",
    "pglast~=7.10",
    "psycopg[binary]~=3.2",
    "tqdm~=4.67",
]

[project.optional-dependencies]
vis = [
    "matplotlib~=3.10",
    "seaborn~=0.13",
    "graphviz~=0.21",
]
duckdb = [
    "quacklab~=1.5",
]
mysql = [
    "mysql-connector-python~=9.5"
]


[project.urls]
"Homepage" = "https://github.com/Optimizer-Playground/PostBOUND"

[dependency-groups]
# Everything required to develop PostBOUND. `uv sync` installs this group by default.
# ruff and ty are pinned exactly: ruff's default rule set changes between minor releases and ty is
# still pre-1.0, so an unpinned tool would report different results on different machines.
dev = [
    "ipython>=9.8.0",
    "jupyterlab>=4.6.1",
    "pre-commit>=4.4",
    "pyarrow>=23.0.0",
    "ruff==0.16.6",
    "tables==3.11.1",
    "ty==0.0.78",
]
doc = [
    "ipython>=9.8.0",
    "sphinx>=9.1.0",
    "sphinx-book-theme>=1.1.4",
]

[tool.uv]
required-version = ">=0.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["postbound*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["docs/build", "docs/source/generated"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length is enforced by the formatter; long docstring prose is not rewrapped
    "UP046",   # PEP 695 generic classes: genuine refactors, tracked separately
    "UP047",   # PEP 695 generic functions: ditto
    "RUF001",  # ambiguous unicode in strings: intentional in the operator/plan symbols
    "RUF002",  # ambiguous unicode in docstrings: intentional in the research prose
]

[tool.ruff.lint.isort]
known-first-party = ["postbound"]

[tool.ty.src]
exclude = ["vol-postbound/**", "**/*.ipynb"]
