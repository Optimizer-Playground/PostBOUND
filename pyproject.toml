[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PostBOUND"
version = "0.22.0.dev1"
authors = [{ name = "Rico Bergmann", email = "rico.bergmann1@tu-dresden.de" }]
description = "PostBOUND is a research framework to prototype and benchmark database query optimizers"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
dependencies = [
    "lazy-loader~=0.4",
    "levenshtein~=0.27",
    "natsort~=8.4",
    "networkx~=3.5",
    "numpy~=2.3",
    "pandas~=2.3",
    "pglast~=7.10",
    "psycopg[binary]~=3.2",
    "tqdm~=4.67",
]

[project.optional-dependencies]
vis = [
    "matplotlib~=3.10",
    "seaborn~=0.13",
    "graphviz~=0.21",
]
duckdb = [
    "quacklab~=1.5",
]
mysql = [
    "mysql-connector-python~=9.5"
]


[project.urls]
"Homepage" = "https://github.com/Optimizer-Playground/PostBOUND"

[dependency-groups]
# Everything required to develop PostBOUND. `uv sync` installs this group by default.
# ruff and ty are pinned exactly: ruff's default rule set changes between minor releases and ty is
# still pre-1.0, so an unpinned tool would report different results on different machines.
dev = [
    # Pull in every optional backend: without them ty cannot resolve the imports in vis/,
    # duckdb.py and mysql.py, so type-check results would depend on which extras a
    # developer happened to sync.
    "postbound[duckdb,mysql,vis]",
    "ipython>=9.8.0",
    "jupyterlab>=4.6.1",
    "pre-commit>=4.4",
    "pyarrow>=23.0.0",
    "ruff==0.16.6",
    "tables==3.11.1",
    "ty==0.0.78",
]
doc = [
    "ipython>=9.8.0",
    "sphinx>=9.1.0",
    "sphinx-book-theme>=1.1.4",
]

[tool.uv]
required-version = ">=0.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["postbound*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["docs/build", "docs/source/generated"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length is enforced by the formatter; long docstring prose is not rewrapped
    "UP046",   # PEP 695 generic classes: genuine refactors, tracked separately
    "UP047",   # PEP 695 generic functions: ditto
    "RUF001",  # ambiguous unicode in strings: intentional in the operator/plan symbols
    "RUF002",  # ambiguous unicode in docstrings: intentional in the research prose
    "SIM108",  # if/else -> ternary: hurts readability for the multi-branch cases here
]

[tool.ruff.lint.isort]
known-first-party = ["postbound"]

[tool.ruff.lint.flake8-bugbear]
# These factories all return immutable value objects, so sharing one instance across all calls
# (which is what a default argument does) is safe and intentional.
extend-immutable-calls = [
    "postbound._core.Cardinality.unknown",
    "postbound.qal._qal.Explain.plan",
    "postbound.qal.Explain.plan",
    "postbound.qal._qal.StarExpression",
]

[tool.ty.src]
exclude = [
    "vol-postbound/**",
    "**/*.ipynb",
    # BROKEN: both import `postbound.experiments`, which no longer exists. They need to be
    # ported or deleted; until then there is nothing meaningful for ty to check.
    "tools/ceb-generator.py",
    "tools/query-generator.py",
]

# The overrides below silence rule families in specific files rather than excluding the files.
# `unresolved-import` and `unresolved-attribute` are deliberately left enforced everywhere,
# because those are the diagnostics that catch modules going stale after a refactoring.

# relalg.py: RelNode.mutate() is declared to return RelNode but every subclass narrows the
# return type to itself, which is not expressible without making RelNode generic in Self.
# TODO: revisit once RelNode is parameterised, then drop this override.
[[tool.ty.overrides]]
include = ["postbound/relalg.py"]
[tool.ty.overrides.rules]
invalid-method-override = "ignore"
invalid-return-type = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
unsupported-operator = "ignore"

# vis/: thin wrappers over graphviz, matplotlib and seaborn, whose stubs are much stricter
# than the runtime APIs actually are.
[[tool.ty.overrides]]
include = ["postbound/vis/**"]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
no-matching-overload = "ignore"
unknown-argument = "ignore"

# util/dicts.py: frozendict disables mutation by assigning None over the inherited methods,
# which is intentional but not expressible in the type system.
[[tool.ty.overrides]]
include = ["postbound/util/dicts.py"]
[tool.ty.overrides.rules]
invalid-assignment = "ignore"
invalid-argument-type = "ignore"
invalid-type-form = "ignore"

# tests/ and db-support/: test fixtures pass SqlQuery where SelectStatement is declared, and
# the db-support scripts use os.system on purpose.
[[tool.ty.overrides]]
include = ["tests/**", "db-support/**"]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
deprecated = "ignore"
